# mc-launcher sample configuration
#
# Section names:
#   [compositor]        — exactly one, started first, restarted automatically
#                         if it crashes (which also implies all clients die
#                         and get respawned)
#   [client:<name>]     — any number of clients; <name> is for logs only
#
# Per-section keys (all optional except `binary`):
#   binary    = /full/path/to/executable        (required)
#   args      = arg1 arg2 ...                   (whitespace-separated)
#   autostart = yes|no                          (default yes)
#   respawn   = yes|no                          (default yes; clean exit code 0
#                                                NEVER respawns regardless)
#   delay_ms  = N                               (delay before first start;
#                                                default 0 for compositor,
#                                                500 for clients to give the
#                                                compositor time to listen)

[compositor]
binary    = /data/mc_demo/mc-compositor
args      = -v -i /dev/input/event1

[client:dashboard]
binary    = /data/mc_demo/demo-fullscreen
delay_ms  = 500
respawn   = yes
autostart = yes

[client:popup]
binary    = /data/mc_demo/demo-popup
args      = --x 200 --y 120 --w 400 --h 240
delay_ms  = 800
respawn   = yes
autostart = yes
